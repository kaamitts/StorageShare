services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: storageshare
      POSTGRES_USER: storageshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storageshare-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storageshare -d storageshare"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-demo-only-replace-before-deployment-2026}
      DEBUG: "1"
      # For a phone on the same Wi-Fi: add the computer's LAN IP to ALLOWED_HOSTS,
      # use it in FRONTEND_BASE_URL and set FRONTEND_BIND=0.0.0.0 (docs/api-partner.md).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgres://storageshare:${POSTGRES_PASSWORD:-storageshare-local}@db:5432/storageshare
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  booking-expiry:
    build: ./backend
    entrypoint: ["python", "manage.py"]
    command: ["expire_pending_bookings", "--loop", "--interval", "30"]
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-demo-only-replace-before-deployment-2026}
      DEBUG: "1"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgres://storageshare:${POSTGRES_PASSWORD:-storageshare-local}@db:5432/storageshare
      SEED_DEMO_DATA: "0"
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:-}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata:
